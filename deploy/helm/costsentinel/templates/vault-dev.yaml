{{- if .Values.vault.dev.enabled }}
{{- $r := .Release.Name }}
# DEV ONLY: in-memory Vault with a root token; secrets vanish on restart. Seed it with scripts/seed_vault_k8s.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $r }}-vault
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $r }}-vault }
  template:
    metadata:
      labels: { app: {{ $r }}-vault }
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          env:
            - { name: VAULT_DEV_ROOT_TOKEN_ID, value: {{ .Values.vault.dev.rootToken | quote }} }
            - { name: VAULT_DEV_LISTEN_ADDRESS, value: "0.0.0.0:8200" }
          ports: [{ containerPort: 8200 }]
          securityContext: { capabilities: { add: [IPC_LOCK] } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $r }}-vault
spec: { selector: { app: {{ $r }}-vault }, ports: [{ port: 8200 }] }
{{- end }}
