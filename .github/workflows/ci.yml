name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      vault:
        image: hashicorp/vault:1.17
        env: { VAULT_DEV_ROOT_TOKEN_ID: dev-root-token }
        ports: ["8200:8200"]
        options: --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Seed a throwaway Vault secret (integration test target; never a real key)
        run: |
          curl -sf --retry 15 --retry-delay 2 --retry-connrefused -H "X-Vault-Token: dev-root-token" \
            -d '{"data":{"nvidia_api_key":"ci-placeholder-not-a-real-key"}}' \
            http://127.0.0.1:8200/v1/secret/data/costsentinel
      - run: cd backend && python -m pytest -q -p no:warnings

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, load: true, tags: "costsentinel-backend:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      # Trivy runs as a pinned container, not a third-party action: no action-of-an-action in the supply chain
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 costsentinel-backend:ci
      - name: Trivy repo scan (secrets + misconfig in Dockerfile/Helm/compose)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 \
            fs --scanners secret,misconfig --severity HIGH,CRITICAL --ignorefile /src/.trivyignore.yaml --exit-code 1 /src
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with: { context: backend, push: true, tags: "ghcr.io/${{ github.repository }}/backend:${{ github.sha }},ghcr.io/${{ github.repository }}/backend:latest", cache-from: type=gha }

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/costsentinel && helm template t deploy/helm/costsentinel > /dev/null
